[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailpilot"
dynamic = ["version"]
description = "LangGraph agent that triages customer-support email for a shipping platform, looks up parcels, answers from a knowledge base and drafts guarded replies."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["langgraph", "langchain", "ai-agent", "customer-support", "email-automation", "rag", "gmail"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Communications :: Email",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "pydantic>=2.6,<3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["langchain-google-genai>=2.1"]
groq = ["langchain-groq>=0.3"]
openai = ["langchain-openai>=0.3"]
anthropic = ["langchain-anthropic>=0.3"]
gmail = ["google-api-python-client>=2.100", "google-auth-oauthlib>=1.2"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["mailpilot[gemini,gmail,api]"]
dev = [
    "mailpilot[gmail,api]",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
mailpilot = "mailpilot.cli:main"

[tool.setuptools.dynamic]
version = { attr = "mailpilot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mailpilot = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::ResourceWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
source = ["mailpilot"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S"]
# PLC0415: optional providers (Gmail, FastAPI, LLM SDKs) are imported lazily on purpose.
ignore = ["PLR0913", "PLR2004", "PLC0415", "SIM905", "S101", "S311", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S108", "N818"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["mailpilot"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
