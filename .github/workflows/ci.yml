name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov --cov-fail-under=90

  # Runs the real model against the labelled set when a key is configured (manual or nightly).
  eval:
    if: github.event_name == 'push' && vars.RUN_EVAL == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[gemini]"
      - run: mailpilot eval --out reports
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          METRICS_DB: none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: reports/
